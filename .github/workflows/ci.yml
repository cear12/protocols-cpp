name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # POSIX sockets + the optional libcurl/jsoncpp/websocketpp/gRPC deps
    # below all target Linux; ubuntu-latest is the one runner that can
    # actually build every target in this repo via apt.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install optional protocol dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libjsoncpp-dev libwebsocketpp-dev libboost-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
